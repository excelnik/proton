name: Publish Windows release

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify package and lockfile versions
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!==l.version||p.version!==l.packages[''].version)throw new Error('package.json and package-lock.json versions do not match')"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx --yes @electron/rebuild --force --only better-sqlite3

      - name: Run unit tests
        run: npm test

      - name: Build renderer
        run: npm run webpack:build

      - name: Build Windows installer and update metadata
        run: npx electron-builder --win nsis --publish never

      - name: Verify updater metadata
        shell: pwsh
        run: |
          if (!(Test-Path "dist-app/latest.yml")) { throw "electron-builder did not create latest.yml" }
          if (!(Test-Path "dist-app/Pruton.Setup.exe")) { throw "Windows installer was not created" }

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pruton ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: true
          files: |
            dist-app/Pruton.Setup.exe
            dist-app/latest.yml
            dist-app/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
